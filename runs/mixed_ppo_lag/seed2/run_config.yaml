summary:
  algo: ppo_lag
  seed: 2
  total_timesteps: 200000
  train_seconds: 510.1
  env_names:
  - highway_dr
  - ramp_merge_dr
algo:
  algo: ppo_lag
  policy: MlpPolicy
  total_timesteps: 200000
  n_envs: 8
  observation:
    type: Kinematics
    vehicles_count: 15
    features:
    - presence
    - x
    - y
    - vx
    - vy
    - cos_h
    - sin_h
    absolute: false
    normalize: true
    order: sorted
    features_range:
      x:
      - -200
      - 200
      y:
      - -16
      - 16
      vx:
      - -80
      - 80
      vy:
      - -80
      - 80
  action:
    type: DiscreteMetaAction
    target_speeds:
    - 10
    - 15
    - 20
    - 25
    - 30
  policy_kwargs:
    net_arch:
      pi:
      - 64
      - 64
      vf:
      - 64
      - 64
    features_extractor_class: ego_attention
    features_extractor_kwargs:
      embed_dim: 64
      n_heads: 2
      features_dim: 64
  hyperparams:
    learning_rate: 0.0005
    n_steps: 128
    batch_size: 64
    n_epochs: 10
    gamma: 0.9
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
  name: ppo_lag
  safety:
    ttc_threshold: 2.0
    headway_threshold: 1.0
    crash_cost: 10.0
  lagrangian:
    cost_limit: 2.0
    lam_init: 0.0
    kp: 0.05
    ki: 0.01
    kd: 0.0
    normalize: true
env_specs:
- id: highway-fast-v0
  config:
    lanes_count: 3
    vehicles_count: 20
    vehicles_density: 1.0
    duration: 30
    observation:
      type: Kinematics
      vehicles_count: 15
      features:
      - presence
      - x
      - y
      - vx
      - vy
      - cos_h
      - sin_h
      absolute: false
      normalize: true
      order: sorted
      features_range:
        x:
        - -200
        - 200
        y:
        - -16
        - 16
        vx:
        - -80
        - 80
        vy:
        - -80
        - 80
    action:
      type: DiscreteMetaAction
      target_speeds:
      - 10
      - 15
      - 20
      - 25
      - 30
  randomization:
    params:
      vehicles_density:
        uniform:
        - 0.7
        - 2.0
      other_vehicles_type:
        choice:
        - idm
        - randomized
        - aggressive
        - cautious
  safety:
    ttc_threshold: 2.0
    headway_threshold: 1.0
    crash_cost: 10.0
- id: RampMerge-v0
  config:
    vehicles_density: 1.0
    simulation_frequency: 5
    observation:
      type: Kinematics
      vehicles_count: 15
      features:
      - presence
      - x
      - y
      - vx
      - vy
      - cos_h
      - sin_h
      absolute: false
      normalize: true
      order: sorted
      features_range:
        x:
        - -200
        - 200
        y:
        - -16
        - 16
        vx:
        - -80
        - 80
        vy:
        - -80
        - 80
    action:
      type: DiscreteMetaAction
      target_speeds:
      - 10
      - 15
      - 20
      - 25
      - 30
  randomization:
    params:
      vehicles_density:
        uniform:
        - 0.5
        - 1.5
      other_vehicles_type:
        choice:
        - idm
        - randomized
        - aggressive
        - cautious
  safety:
    ttc_threshold: 2.0
    headway_threshold: 1.0
    crash_cost: 10.0
