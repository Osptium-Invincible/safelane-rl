# PPO + our ego-attention extractor over 15 vehicles x 7 features
base: ppo
observation:
  type: Kinematics
  vehicles_count: 15
  features: [presence, x, y, vx, vy, cos_h, sin_h]
  absolute: false
  normalize: true
  order: sorted
  # fixed normalisation for every road: highway-env would otherwise derive the lateral range from the
  # lanes next to the ego at reset (1 lane on the ramp, 3-4 on highways) and clip/rescale observations
  features_range: {x: [-200, 200], y: [-16, 16], vx: [-80, 80], vy: [-80, 80]}
policy_kwargs:
  features_extractor_class: ego_attention
  features_extractor_kwargs: {embed_dim: 64, n_heads: 2, features_dim: 64}
  net_arch: {pi: [64, 64], vf: [64, 64]}
