# Vanilla DQN (SB3). Hyperparameters follow highway-env's official example, gamma raised to 0.9
algo: dqn
policy: MlpPolicy
total_timesteps: 50000
n_envs: 1
observation:
  type: Kinematics
  vehicles_count: 5
  features: [presence, x, y, vx, vy]
  absolute: false
  normalize: true
  order: sorted
  # fixed normalisation for every road: highway-env would otherwise derive the lateral range from the
  # lanes next to the ego at reset (1 lane on the ramp, 3-4 on highways) and clip/rescale observations
  features_range: {x: [-200, 200], y: [-16, 16], vx: [-80, 80], vy: [-80, 80]}
action:
  type: DiscreteMetaAction
  target_speeds: [10, 15, 20, 25, 30]
policy_kwargs:
  net_arch: [256, 256]
hyperparams:
  learning_rate: 5.0e-4
  buffer_size: 15000
  learning_starts: 200
  batch_size: 32
  gamma: 0.9
  train_freq: 1
  gradient_steps: 1
  target_update_interval: 50
  exploration_fraction: 0.3
  exploration_final_eps: 0.05
