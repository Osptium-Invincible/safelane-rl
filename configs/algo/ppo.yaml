# PPO with an MLP over the 5x5 Kinematics matrix
algo: ppo
policy: MlpPolicy
total_timesteps: 120000
n_envs: 8
observation:
  type: Kinematics
  vehicles_count: 5
  features: [presence, x, y, vx, vy]
  absolute: false
  normalize: true
  order: sorted
  # fixed normalisation for every road: highway-env would otherwise derive the lateral range from the
  # lanes next to the ego at reset (1 lane on the ramp, 3-4 on highways) and clip/rescale observations
  features_range: {x: [-200, 200], y: [-16, 16], vx: [-80, 80], vy: [-80, 80]}
action:
  type: DiscreteMetaAction
  target_speeds: [10, 15, 20, 25, 30]
policy_kwargs:
  net_arch: {pi: [256, 256], vf: [256, 256]}
hyperparams:
  learning_rate: 5.0e-4
  n_steps: 128
  batch_size: 64
  n_epochs: 10
  gamma: 0.9
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
