name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.12 .venv
          . .venv/bin/activate
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install -e ".[dev]"
      - name: Lint
        run: . .venv/bin/activate && ruff check safelane scripts tests
      - name: Unit tests
        run: . .venv/bin/activate && pytest -q
      - name: Smoke training run
        run: . .venv/bin/activate && python scripts/train.py env=ramp_merge algo=ppo_lag algo.total_timesteps=1024 algo.n_envs=2 run_dir=runs/_smoke/seed0
